<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile - Health Guardian</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/edit_profile.css') }}">
</head>
<body>

  <div class="page-bg">
  <div class="bg-circle1"></div>
  <div class="bg-circle2"></div>
  <div class="bg-circle3"></div>

  <div class="page">

  <div class="page-header">
    <div class="back-btn" onclick="window.location.href='/main'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M19 12H5"/>
        <path d="M12 19l-7-7 7-7"/>
      </svg>
    </div>

    <div class="page-title" id="editProfileModalTitle">
      Edit Profile
    </div>
  </div>

  <div class="content">

    <form method="POST" action="/save_profile">

      <div class="section-title" id="personalInfoTitle">Personal Information</div>

<div class="field-group">
  <span class="field-label" id="emailFieldLabel">Email</span>
  <input
    type="email"
    class="field-input"
    id="editEmailInput"
    name="email"
    value="{{ user[1] or '' }}"
    placeholder="email@example.com"
  >
</div>

<div class="field-group">
  <span class="field-label" id="ageFieldLabel">Age</span>
  <input
    type="number"
    class="field-input"
    name="age"
    value="{{ user[2] or '' }}"
  >
</div>

<div class="field-group">
  <span class="field-label" id="genderFieldLabel">Gender</span>
  <select class="field-input" name="gender">
    <option value="" id="selectGenderOpt">Select Gender</option>
    <option value="Male" id="maleOpt" {% if user[3] == 'Male' %}selected{% endif %}>Male</option>
    <option value="Female" id="femaleOpt" {% if user[3] == 'Female' %}selected{% endif %}>Female</option>
    <option value="Other" id="otherOpt" {% if user[3] == 'Other' %}selected{% endif %}>Other</option>
  </select>
</div>

<div class="field-group">
  <span class="field-label" id="dobFieldLabel">Date of Birth</span>
  <input
    type="date"
    class="field-input"
    name="dob"
    value="{{ user[4] or '' }}"
  >
</div>

<div class="field-group">
  <span class="field-label" id="stateFieldLabel">State</span>
  <input
    type="text"
    class="field-input"
    name="state"
    value="{{ user[5] or '' }}"
  >
</div>

<div class="field-group">
  <span class="field-label" id="cityFieldLabel">City</span>
  <input
    type="text"
    class="field-input"
    name="city"
    value="{{ user[6] or '' }}"
  >
</div>

<div class="field-group">
  <span class="field-label" id="addressFieldLabel">Address</span>
  <input
    type="text"
    class="field-input"
    name="address"
    value="{{ user[7] or '' }}"
  >
</div>
    <div class="section-title" id="editFamilyContactTitle">Family Contact No.</div>

<div class="field-group">
  <span class="field-label" id="editFamilyContact1Label">Family Contact 1</span>
  <input
    type="tel"
    class="field-input"
    id="editFamilyContact1Input"
    name="family_contact1"
    value="{{ user[8] or '' }}"
  >
</div>

<div class="field-group">
  <span class="field-label" id="editFamilyContact2Label">Family Contact 2</span>
  <input
    type="tel"
    class="field-input"
    id="editFamilyContact2Input"
    name="family_contact2"
    value="{{ user[9] or '' }}"
  >
</div>

<div class="field-group">
  <span class="field-label" id="editFamilyContact3Label">Family Contact 3</span>
  <input
    type="tel"
    class="field-input"
    id="editFamilyContact3Input"
    name="family_contact3"
    value="{{ user[10] or '' }}"
  >
</div>

<div class="section-title" id="editDoctorSectionTitle">
  Doctor Mobile No.
</div>

<div class="field-group">
  <span class="field-label" id="editDoctorMobileLabel">
    Doctor Mobile No.
  </span>

<input
type="tel"
class="field-input"
id="editDoctorMobileInput"
name="doctor_contact"
value="{{ user[11] or '' }}"

>

</div>

<div class="section-title" id="editFamilyEmailTitle">
  Family Email
</div>

<div class="field-group">
  <span class="field-label" id="editFamilyEmail1Label">
    Family Email 1
  </span>

<input
type="email"
class="field-input"
id="editFamilyEmail1Input"
 name="family_email_1"
value="{{ user[12] or '' }}"

>

</div>

<div class="field-group">
  <span class="field-label" id="editFamilyEmail2Label">
    Family Email 2
  </span>

<input
type="email"
class="field-input"
id="editFamilyEmail2Input"
 name="family_email_2"
value="{{ user[13] or '' }}"

>

</div>

<div class="field-group">
  <span class="field-label" id="editFamilyEmail3Label">
    Family Email 3
  </span>

<input
type="email"
class="field-input"
id="editFamilyEmail3Input"
 name="family_email_3"
value="{{ user[14] or '' }}"

>

</div>


  <div class="save-bar">
    <div class="save-bar-inner">
      <button
  type="button"
  class="btn-blue"
  onclick="saveEditProfile()"
  id="saveEditProfileBtn">
  Save
</button>
  </div>
</div>

<div class="toast" id="toast"></div>
</form>
  </div>
  </div>
<script src="{{ url_for('static', filename='js/edit_profile.js') }}"></script>

</body>
</html>
