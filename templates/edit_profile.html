<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile - Health Guardian</title>
<style>
  :root {
    --blue: #2563eb;
    --blue-light: #dbeafe;
    --blue-mid: #eff6ff;
    --white: #ffffff;
    --text-dark: #1e293b;
    --text-mid: #64748b;
    --border: #e2e8f0;
    --red: #ef4444;
    --red-light: #fef2f2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #f1f5fb;
    color: var(--text-dark);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  /* ================================
   EDIT PROFILE PAGE
   ================================ */

.page {
  width: 100% !important;
  max-width: 720px !important;
  min-height: 100vh !important;

  margin: 0 auto !important;
  padding: 0 !important;

  background: #ffffff !important;

  display: block !important;
  box-sizing: border-box !important;
}


/* ---------- HEADER ---------- */

.page-header {
  width: 100% !important;
  height: 78px !important;

  box-sizing: border-box !important;

  display: flex !important;
  flex-direction: row !important;
  align-items: center !important;

  gap: 18px !important;

  padding: 18px 24px !important;

  background: #ffffff !important;

  border-bottom: 1px solid var(--border) !important;

  position: sticky !important;
  top: 0 !important;

  z-index: 5 !important;
}


/* ---------- BACK ARROW ---------- */

.back-btn {
  width: 50px !important;
  height: 50px !important;

  min-width: 50px !important;
  min-height: 50px !important;

  flex: 0 0 50px !important;

  border-radius: 10px !important;

  border: 1px solid var(--border) !important;

  background: #ffffff !important;

  display: flex !important;
  align-items: center !important;
  justify-content: center !important;

  cursor: pointer !important;

  color: var(--text-dark) !important;

  box-sizing: border-box !important;
}

.back-btn:hover {
  background: var(--blue-mid) !important;
}


/* ---------- TITLE ---------- */

.page-title {
  display: block !important;

  flex: 1 !important;

  margin: 0 !important;
  padding: 0 !important;

  font-size: 26px !important;
  line-height: 1 !important;

  font-weight: 700 !important;

  color: var(--text-dark) !important;

  white-space: nowrap !important;
}


/* ---------- CONTENT ---------- */

.page > .content {
  width: 100% !important;

  box-sizing: border-box !important;

  padding: 20px 24px 110px !important;

  margin: 0 !important;

  display: block !important;
}

.section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-dark);
  margin: 18px 0 10px;
}

.section-title:first-child {
  margin-top: 0;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 14px;
}

.field-label {
  font-size: 11px;
  color: var(--text-mid);
  font-weight: 500;
}

.field-input {
  width: 100%;
  box-sizing: border-box;

  border: 1px solid var(--border);
  border-radius: 10px;

  padding: 11px 12px;

  font-size: 14px;
  font-family: inherit;

  color: var(--text-dark);

  outline: none;

  transition: border-color .15s;
}

.field-input:focus {
  border-color: var(--blue);
}

.save-bar {
  position: fixed !important;

  bottom: 0 !important;
  left: 0 !important;
  right: 0 !important;

  display: flex !important;
  justify-content: center !important;

  background: #ffffff !important;

  border-top: 1px solid var(--border) !important;

  padding: 14px 16px !important;

  box-sizing: border-box !important;

  z-index: 10 !important;
}

.save-bar-inner {
  width: 100% !important;
  max-width: 720px !important;
}

.btn-blue {
  width: 100% !important;

  background: var(--blue) !important;
  color: #ffffff !important;

  border: none !important;
  border-radius: 10px !important;

  padding: 13px !important;

  font-size: 14px !important;
  font-weight: 700 !important;

  cursor: pointer !important;

  transition: opacity .15s;
}

.btn-blue:hover {
  opacity: .88;
}

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: #1e293b;
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: all .25s;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.green { background: #16a34a; }
  .toast.red { background: var(--red); }
</style>
</head>
<body>

  <div class="page">

  <div class="page-header">
    <div class="back-btn" onclick="window.location.href='/main'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M19 12H5"/>
        <path d="M12 19l-7-7 7-7"/>
      </svg>
    </div>

    <div class="page-title" id="editProfileModalTitle">
      Edit Profile
    </div>
  </div>

  <div class="content">

    <form method="POST" action="/save_profile">

      <div class="section-title">Personal Information</div>

<div class="field-group">
  <span class="field-label">Email</span>
  <input
    type="email"
    class="field-input"
    id="editEmailInput"
    name="email"
    value="{{ user[1] or '' }}"
    placeholder="email@example.com"
  >
</div>

<div class="field-group">
  <span class="field-label">Age</span>
  <input
    type="number"
    class="field-input"
    name="age"
    value="{{ user[2] or '' }}"
  >
</div>

<div class="field-group">
  <span class="field-label">Gender</span>
  <select class="field-input" name="gender">
    <option value="">Select Gender</option>
    <option value="Male" {% if user[3] == 'Male' %}selected{% endif %}>Male</option>
    <option value="Female" {% if user[3] == 'Female' %}selected{% endif %}>Female</option>
    <option value="Other" {% if user[3] == 'Other' %}selected{% endif %}>Other</option>
  </select>
</div>

<div class="field-group">
  <span class="field-label">Date of Birth</span>
  <input
    type="date"
    class="field-input"
    name="dob"
    value="{{ user[4] or '' }}"
  >
</div>

<div class="field-group">
  <span class="field-label">State</span>
  <input
    type="text"
    class="field-input"
    name="state"
    value="{{ user[5] or '' }}"
  >
</div>

<div class="field-group">
  <span class="field-label">City</span>
  <input
    type="text"
    class="field-input"
    name="city"
    value="{{ user[6] or '' }}"
  >
</div>

<div class="field-group">
  <span class="field-label">Address</span>
  <input
    type="text"
    class="field-input"
    name="address"
    value="{{ user[7] or '' }}"
  >
</div>
    <div class="section-title" id="editFamilyContactTitle">Family Contact No.</div>

<div class="field-group">
  <span class="field-label" id="editFamilyContact1Label">Family Contact 1</span>
  <input
    type="tel"
    class="field-input"
    id="editFamilyContact1Input"
    name="family_contact1"
    value="{{ user[8] or '' }}"
  >
</div>

<div class="field-group">
  <span class="field-label" id="editFamilyContact2Label">Family Contact 2</span>
  <input
    type="tel"
    class="field-input"
    id="editFamilyContact2Input"
    name="family_contact2"
    value="{{ user[9] or '' }}"
  >
</div>

<div class="field-group">
  <span class="field-label" id="editFamilyContact3Label">Family Contact 3</span>
  <input
    type="tel"
    class="field-input"
    id="editFamilyContact3Input"
    name="family_contact3"
    value="{{ user[10] or '' }}"
  >
</div>

<div class="section-title" id="editDoctorSectionTitle">
  Doctor Mobile No.
</div>

<div class="field-group">
  <span class="field-label" id="editDoctorMobileLabel">
    Doctor Mobile No.
  </span>

<input
type="tel"
class="field-input"
id="editDoctorMobileInput"
name="doctor_contact"
value="{{ user[11] or '' }}"

>

</div>

<div class="section-title" id="editFamilyEmailTitle">
  Family Email
</div>

<div class="field-group">
  <span class="field-label" id="editFamilyEmail1Label">
    Family Email 1
  </span>

<input
type="email"
class="field-input"
id="editFamilyEmail1Input"
 name="family_email_1"
value="{{ user[12] or '' }}"

>

</div>

<div class="field-group">
  <span class="field-label" id="editFamilyEmail2Label">
    Family Email 2
  </span>

<input
type="email"
class="field-input"
id="editFamilyEmail2Input"
 name="family_email_2"
value="{{ user[13] or '' }}"

>

</div>

<div class="field-group">
  <span class="field-label" id="editFamilyEmail3Label">
    Family Email 3
  </span>

<input
type="email"
class="field-input"
id="editFamilyEmail3Input"
 name="family_email_3"
value="{{ user[14] or '' }}"

>

</div>


  <div class="save-bar">
    <div class="save-bar-inner">
      <button
  type="button"
  class="btn-blue"
  onclick="saveEditProfile()"
  id="saveEditProfileBtn">
  Save
</button>
  </div>
</div>

<div class="toast" id="toast"></div>
</form>
<script>
function showToast(msg, type) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast show' + (type ? ' ' + type : '');
  setTimeout(() => { toast.className = 'toast'; }, 2200);
}

async function loadProfileForEdit() {
  try {
    const response = await fetch("/get_contacts");
    const data = await response.json();

    document.getElementById('editFamilyContact1Input').value = data.family_contact1 || '';
    document.getElementById('editFamilyContact2Input').value = data.family_contact2 || '';
    document.getElementById('editFamilyContact3Input').value = data.family_contact3 || '';

    document.getElementById('editDoctorMobileInput').value = data.doctor_contact || '';

    document.getElementById('editFamilyEmail1Input').value = data.family_email1 || '';
    document.getElementById('editFamilyEmail2Input').value = data.family_email2 || '';
    document.getElementById('editFamilyEmail3Input').value = data.family_email3 || '';

    // User Email
    const emailInput = document.getElementById('editEmailInput');

    if (emailInput) {
      emailInput.value = data.email || '';
    }

    console.log("EMAIL SET TO INPUT =", emailInput.value);

  } catch (err) {
    console.error("Error loading profile:", err);
  }
}

document.addEventListener('DOMContentLoaded', loadProfileForEdit);

function saveEditProfile() {

  const form = document.querySelector('form');

  if (!form) {
    showToast('⚠️ Form not found', 'red');
    return;
  }

  const formData = new FormData(form);

  console.log("EMAIL BEING SENT =", formData.get("email"));

  fetch("/save_profile", {
    method: "POST",
    body: formData
  })
  .then(res => {
    if (!res.ok) {
      throw new Error("Profile update failed");
    }

    return res.text();
  })
  .then(() => {
    showToast('✅ Profile updated', 'green');

    setTimeout(() => {
      window.location.href = '/main';
    }, 900);
  })
  .catch(err => {
    console.error(err);
    showToast('⚠️ Could not update profile', 'red');
  });
}


document.addEventListener('DOMContentLoaded', loadProfileForEdit);
</script>

</body>
</html>
