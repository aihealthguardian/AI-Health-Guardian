<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic AI Healthcare - Permissions</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/permission.css') }}">
</head>
<body>

<!-- Language Selector -->
<div class="lang-selector">
    <select id="languageSelect" onchange="changeLanguage(this.value)">
        <option value="en">🇬🇧 English</option>
        <option value="mr">🇮🇳 मराठी</option>
        <option value="hi">🇮🇳 हिंदी</option>
        <option value="gu">🇮🇳 ગુજરાતી</option>
        <option value="ta">🇮🇳 தமிழ்</option>
        <option value="te">🇮🇳 తెలుగు</option>
        <option value="kn">🇮🇳 ಕನ್ನಡ</option>
        <option value="bn">🇮🇳 বাংলা</option>
        <option value="pa">🇮🇳 ਪੰਜਾਬੀ</option>
    </select>
</div>

<div class="bg-circle1"></div>
<div class="bg-circle2"></div>
<div class="bg-circle3"></div>

<div class="permission-box">
    <div class="app-name" id="appName">Agentic AI Healthcare</div>
    <div class="logo" id="icon"><i class="ti ti-map-pin"></i></div>
    <h1 id="title">Location Permission</h1>
    <p id="description">Allow location access for emergency services and nearby healthcare support.</p>
    <div class="buttons">
        <button id="denyBtn" class="deny" onclick="denyPermission()">Don't Allow</button>
        <button id="allowBtn" class="allow" onclick="allowPermission()">Allow</button>
    </div>
    <div class="progress" id="progress">Permission 1 of 4</div>
</div>

<script src="{{ url_for('static', filename='js/permission.js') }}"></script>
</body>
</html>
