<!DOCTYPE html>

<title>Agentic AI Healthcare - Permissions</title>
<style>
    :root{ --primary:#2563EB; --accent:#93C5FD; }
    *{ margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
    body{ background:#EEF4FF; display:flex; justify-content:center; align-items:center; height:100vh; position:relative; overflow:hidden; }
    .permission-box{ width:450px; background:#F8FAFF; padding:35px; border-radius:30px; text-align:center; box-shadow:0 8px 25px rgba(0,0,0,0.08); border:1px solid #DCE6FF; }
    .logo{ font-size:60px; margin-bottom:15px; color:#2563EB; }
    h1{ color:#2563EB; margin-bottom:10px; font-size:28px; }
    p{ color:#666; line-height:1.6; margin-bottom:25px; }
    .buttons{ display:flex; gap:12px; }
    button{ flex:1; padding:14px; border:none; border-radius:12px; font-size:16px; cursor:pointer; transition:0.3s; }
    .allow{ background:#2563EB; color:white; }
    .allow:hover{ background:#1D4ED8; }
    .deny{ background:#EAF1FF; color:#2563EB; border:1px solid #C7D7FF; }
    .deny:hover{ background:#DCE8FF; }
    .progress{ margin-top:20px; color:#2563EB; font-weight:bold; }
    .app-name{ color:#2563EB; margin-bottom:20px; font-size:20px; font-weight:700; }

    .bg-circle2 { position: absolute; width: 220px; height: 220px; border-radius: 50%; background: #60A5FA; opacity: 0.18; bottom: -60px; right: -40px; pointer-events: none; }

// ============================================
// MAIN LOGIC
// ============================================
let current = 0;
let isProcessing = false;
let permissions = {
    location: false,
    microphone: false,
    notification: false,
    speaker: false
};
let lang = localStorage.getItem("selectedLanguage") || "en";

function getTranslations() {
    return translations[lang] || translations.en;
}

function updateUI() {
    const t = getTranslations();
    const perm = t.permissions[current];
    
    document.getElementById("appName").textContent = t.appName;
    document.getElementById("icon").innerHTML = `<i class="ti ${perm.icon}"></i>`;
    document.getElementById("title").textContent = perm.title;
    document.getElementById("description").textContent = perm.desc;
    document.getElementById("allowBtn").textContent = t.allowBtn;
    document.getElementById("denyBtn").textContent = t.denyBtn;
    document.getElementById("progress").textContent = t.progress
        .replace("{current}", current + 1)
        .replace("{total}", t.permissions.length);
}

function changeLanguage(value) {
    lang = value;
    localStorage.setItem("selectedLanguage", value);
    current = 0;
    updateUI();
}

// Load saved language
document.addEventListener("DOMContentLoaded", function () {

    const lang = localStorage.getItem("selectedLanguage") || "en";

    document.getElementById("languageSelect").value = lang;

    selectedLangCode = lang;

    updateUI();
});

function allowPermission() {

    if (isProcessing) return;
    isProcessing = true;

    requestPermission(current, function () {

        if (current === 0) permissions.location = true;
        if (current === 1) permissions.microphone = true;
        if (current === 2) permissions.notification = true;
        if (current === 3) permissions.speaker = true;

        current++;

        const t = getTranslations();

        if (current < t.permissions.length) {

            updateUI();
            isProcessing = false;

        } else {

            fetch("/save_permissions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(permissions)
            })
            .then(res => res.json())
            .then(data => {
                alert(t.completedMsg);
                window.location.href = "/main";
            });

        }

    });

}

function denyPermission() {

    if (isProcessing) return;
    isProcessing = true;

    if (current === 0) permissions.location = false;
    if (current === 1) permissions.microphone = false;
    if (current === 2) permissions.notification = false;
    if (current === 3) permissions.speaker = false;

    current++;

    const t = getTranslations();

    if (current < t.permissions.length) {

        updateUI();
        isProcessing = false;

    } else {

        fetch("/save_permissions", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(permissions)
        })
        .then(res => res.json())
        .then(data => {
            alert(t.completedMsg);
            window.location.href = "/main";
        });

    }

}

function requestPermission(index, callback) {
    switch(index) {
        case 0: // Location
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    () => callback(),
                    () => callback()
                );
            } else {
                callback();
            }
            break;
            
        case 1: // Microphone
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                    .then(stream => {
                        stream.getTracks().forEach(t => t.stop());
                        callback();
                    })
                    .catch(() => callback());
            } else {
                callback();
            }
            break;
            
        case 2: // Notification
            if ('Notification' in window) {
                if (Notification.permission === 'granted' || Notification.permission === 'denied') {
                    callback();
                } else {
                    Notification.requestPermission().then(() => callback());
                }
            } else {
                callback();
            }
            break;
            
        case 3: // Speaker
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') {
                    ctx.resume().then(() => callback()).catch(() => callback());
                } else {
                    callback();
                }
            } catch(e) {
                callback();
            }
            break;
            
        default:
            callback();
    }
}
